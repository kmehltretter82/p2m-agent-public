[project]
name = "p2m-agent"
version = "0.1.0"
description = "Personal Prove2Me proof agent: Python controller, Claude Agent SDK worker, lean-lsp-mcp"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.176",
    "httpx>=0.27,<1",
    "lean-lsp-mcp==0.32.0",
    "pydantic>=2.7,<3",
    "ripgrep>=15.1.0",
]

[project.scripts]
p2m = "p2m_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2m_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lean: needs a local Lean toolchain (core Lean only, no Mathlib)",
    "mathlib: needs a built Mathlib environment; slow on small machines",
    "live: calls the real Prove2Me API or Claude; never run by default",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23",
]
